# ⚠️ EXPERIMENTAL / NOT CURRENTLY FUNCTIONAL — not part of day-to-day dev workflow.
# Known issues as of the 2026-09 codebase health pass, none fixed here:
#   - "react-router" service builds ./apps/react-router/Dockerfile, which does not
#     exist (the frontend app is apps/chat-ui and has no Dockerfile at all).
#   - "ai-agent" service's build context and volume mount use apps/ai-agent /
#     apps/ai_agent/src/ai_agent (mixed hyphen/underscore paths that don't match
#     the real apps/ai_agent directory).
#   - apps/ai_agent/Dockerfile is unmodified `langgraph build` output (LangGraph
#     Platform template), still referencing /deps/ai-agent throughout.
# Use `pnpm dev` / `poetry run uvicorn ...` (see CLAUDE.md) for local development.
services:
  react-router:
    build:
      context: .
      dockerfile: ./apps/react-router/Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./apps/react-router:/app/apps/react-router
      - /app/node_modules
      - /app/apps/react-router/node_modules
    environment:
      - NODE_ENV=development
    networks:
      - threadwise-network

  ai-agent:
    build:
      context: apps/ai_agent/src/ai_agent
      dockerfile: Dockerfile
    ports:
      - "8100:8100"
    volumes:
      - ./apps/ai-agent/src:/app/src
    environment:
      - ENVIRONMENT=development
      - PYTHONPATH=/app/src
    networks:
      - threadwise-network


volumes:
  postgres_data:
  redis_data:

networks:
  threadwise-network:
    driver: bridge
