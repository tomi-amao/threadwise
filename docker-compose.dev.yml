# Debugging overrides for docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# Publishes the LangGraph server's Postgres and Redis on the host so you can inspect them, and
# turns the agent's logging up. For hot-reload development use `pnpm dev:all` instead (see
# CLAUDE.md); containers here run the built images.
services:
  langgraph-postgres:
    ports:
      - '5433:5432'

  langgraph-redis:
    ports:
      - '6379:6379'

  langgraph-api:
    environment:
      LOG_LEVEL: debug
