[project]
name = "threadwise-ai-agent"
version = "0.1.0"
description = ""
authors = [
    {name = "Ignorant View",email = "theignorant.views@gmail.com"}
]
readme = "README.md"
requires-python = "<3.14,>=3.10"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.34.2,<0.35.0)",
    "pydantic (>=2.11.5,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "langgraph (>=1.2.18)",
    "langchain-openai (>=1.7.3)",
    "langchain-community (>=0.3.28)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "python-dotenv (>=1.1.1,<2.0.0)",
    "sentence-transformers (>=6.0.1,<7.0.0)",
    "supabase (>=2.10.0)",
    "pypdf (>=6.0.0,<7.0.0)",
    "python-docx (>=1.1.0,<2.0.0)",
    "python-multipart (>=0.0.20,<1.0.0)",
    "langchain-huggingface (>=1.2.3)",
    "langchain (>=1.4.7,<2.0.0)",
    "langgraph-cli[inmem] (>=0.4.40,<0.5.0)",
    "langchain-text-splitters (>=1.1.3,<2.0.0)",
    "langchain-google-genai (>=4.4.2,<5.0.0)",
    # Pinecone vector store integration
    "pinecone (>=5.0.0)",
    "langchain-pinecone (>=0.2.0)",
    "inngest (>=0.5.15,<0.6.0)",
    # Verifying Supabase user tokens against the project JWKS (ai_agent/core/auth.py)
    "pyjwt[crypto] (>=2.10.0,<3.0.0)",
    "pglast (>=7.0,<8.0)",
]

[tool.poetry]
packages = [{include = "ai_agent", from = "src"}]

[tool.black]
line-length = 88
target-version = ['py313']

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
# The coverage-comment action reads .coverage on another path and needs relative files.
relative_files = true

[tool.poetry.group.dev.dependencies]
black = "^26.3.0"
isort = "^6.0.1"
pytest = "^9.0.3"
pytest-cov = "^7.0.0"
watchfiles = "^1.0.5"
pre-commit = "^4.2.0"
flake8 = "^7.1.1"
flake8-isort = "^6.1.2"
bandit = "^1.8.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
