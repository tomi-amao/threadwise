name: E2E (Playwright)

# Runs the browser tests against a throwaway LOCAL Supabase stack that CI starts itself.
# Nothing here ever touches the hosted project: the e2e tooling refuses to run unless
# SUPABASE_URL is localhost (apps/chat-ui/e2e/env.ts).
#
# The read-only tests run as four shards in parallel, each with its own database. The
# data-changing tests (the `mutations` project) get a job and a database of their own, so
# they can never skew a figure another test is checking.

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/chat-ui/**'
      - 'supabase/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.11.0'

jobs:
  e2e:
    name: Playwright (shard ${{ matrix.shard }}/4)
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies supabase/migrations (the baseline) to a fresh local database.
      # Services the app does not use are skipped to keep startup fast.
      - name: Start local Supabase
        run: supabase start -x studio,mailpit,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Write e2e env from the local stack
        run: pnpm e2e:env

      - name: Seed test data
        run: pnpm e2e:seed

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter threadwise-chat-ui exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter threadwise-chat-ui exec playwright install --with-deps chromium

      # System libraries are not part of the cache.
      - name: Install Playwright system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter threadwise-chat-ui exec playwright install-deps chromium

      - name: Run Playwright tests
        run: >
          pnpm e2e
          --project=desktop-light --project=desktop-dark
          --project=tablet-light --project=tablet-dark
          --project=mobile-light --project=mobile-dark
          --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            apps/chat-ui/playwright-report
            apps/chat-ui/test-results
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  e2e-mutations:
    name: Playwright (data-changing tests)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies supabase/migrations (the baseline) to a fresh local database.
      # Services the app does not use are skipped to keep startup fast.
      - name: Start local Supabase
        run: supabase start -x studio,mailpit,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Write e2e env from the local stack
        run: pnpm e2e:env

      - name: Seed test data
        run: pnpm e2e:seed

      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter threadwise-chat-ui exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm --filter threadwise-chat-ui exec playwright install --with-deps chromium

      # System libraries are not part of the cache.
      - name: Install Playwright system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm --filter threadwise-chat-ui exec playwright install-deps chromium

      - name: Run Playwright tests
        run: pnpm e2e:mutations

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mutations
          path: |
            apps/chat-ui/playwright-report
            apps/chat-ui/test-results
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
