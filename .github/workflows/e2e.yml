name: E2E (Playwright)

# Runs the browser tests against a throwaway LOCAL Supabase stack that CI starts itself.
# Nothing here ever touches the hosted project: the e2e tooling refuses to run unless
# SUPABASE_URL is localhost (apps/chat-ui/e2e/env.ts).

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/chat-ui/**'
      - 'supabase/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10.11.0'

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # Applies supabase/migrations (the baseline) to a fresh local database.
      # Services the app does not use are skipped to keep startup fast.
      - name: Start local Supabase
        run: supabase start -x studio,mailpit,imgproxy,edge-runtime,logflare,vector,supavisor

      - name: Write e2e env from the local stack
        run: pnpm e2e:env

      - name: Seed test data
        run: pnpm e2e:seed

      - name: Install Playwright browsers
        run: pnpm --filter threadwise-chat-ui exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/chat-ui/playwright-report
            apps/chat-ui/test-results
          retention-days: 7

      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup
